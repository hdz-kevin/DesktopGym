[project]
name = "gym"
dynamic = ["version"]
description = "Sistema de gestion de gimnasio para escritorio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8",
    "SQLAlchemy>=2.0.36",
    "alembic>=1.14",
]

[project.scripts]
gym = "gym.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pyinstaller>=6.11",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "gym/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # El gimnasio esta en una sola ciudad y la aplicacion corre en una sola PC:
    # las fechas se guardan en hora local, que es la que el recepcionista ve en
    # la pantalla. Anadir zonas horarias solo complicaria el codigo.
    "DTZ",
    # Qt exige QModelIndex() como valor por defecto en las firmas del modelo.
    "B008",
    # Los genericos con Generic[T] se leen mejor que la sintaxis de PEP 695.
    "UP046",
    "UP047",
    # Los enums heredan de (str, Enum) y no de StrEnum a proposito: str() de un
    # StrEnum devuelve el valor crudo, y estos enums se muestran en pantalla a
    # traves de .label(), no de su valor interno.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Alembic genera estos archivos; no se editan a mano.
"migrations/versions/*.py" = ["E501", "F811", "I001"]
